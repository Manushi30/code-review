services:
  # Node.js Backend API
  - type: web
    name: codereview-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codereview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000

  # React Frontend (Static Site)
  - type: web
    name: codereview-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: codereview-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: codereview-db
    plan: free
    databaseName: codereview_ai
    user: codereview_user
